name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build amd64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags "-s -w" \
            -o dist/singbox-manager-amd64 ./cmd/manager

      - name: Build arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -trimpath -ldflags "-s -w" \
            -o dist/singbox-manager-arm64 ./cmd/manager

      - name: Build mipsle (softfloat)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build \
            -trimpath -ldflags "-s -w" \
            -o dist/singbox-manager-mipsle ./cmd/manager

      - name: Verify binaries
        run: |
          ls -lh dist/
          file dist/singbox-manager-amd64
          file dist/singbox-manager-arm64
          file dist/singbox-manager-mipsle

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum singbox-manager-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}.
            См. CHANGELOG.md в репозитории.
          files: |
            dist/singbox-manager-amd64
            dist/singbox-manager-arm64
            dist/singbox-manager-mipsle
            dist/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
